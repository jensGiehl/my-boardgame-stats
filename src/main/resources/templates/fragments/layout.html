<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10251d">
    <title th:text="${title + ' · BG Stats'}">BG Stats</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css(v=202608162)}">
</head>
<body>
<nav th:fragment="navigation(activePage, username)" class="navbar navbar-expand-lg navbar-dark sticky-top app-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true">BG</span>
            <span>Stats</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation"
                aria-controls="mainNavigation" aria-expanded="false" aria-label="Navigation öffnen">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'games'} ? 'active'" th:href="@{/}">Spiele</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'years'} ? 'active'" th:href="@{/years}">Jahre</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'users'} ? 'active'" th:href="@{/users}">Personen</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'locations'} ? 'active'" th:href="@{/locations}">Orte</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'custom'} ? 'active'" th:href="@{/custom}">Eigene Auswertung</a></li>
                <li class="nav-item ms-lg-2">
                    <form th:action="@{/refresh}" method="post">
                        <button class="btn btn-sm btn-outline-light refresh-button" type="submit">Daten aktualisieren</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<footer th:fragment="footer" class="app-footer">
    <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
        <span>BG Stats · persönliche Brettspielmomente in Zahlen</span>
        <a href="https://boardgamegeek.com" target="_blank" rel="noopener">Daten von BoardGameGeek</a>
    </div>
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/chart.js/4.5.1/dist/chart.umd.js}"></script>
    <script th:src="@{/js/charts.js(v=202608163)}"></script>
</footer>
</body>
</html>
